# AWS publishing uses its own main-only ECR role from midkernel/infra.
# Publication requires explicit activation after role bootstrap. See docs/publishing.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "489470371031"
  ECR_REPOSITORY: midkernel-agentflow-agents
  OIDC_ROLE: arn:aws:iam::489470371031:role/midkernel-github-publish-runner

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  publisher-readiness:
    name: Publisher activation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.activation.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check explicit publisher activation
        id: activation
        env:
          ECR_PUBLISHER_ROLE_ARN: ${{ vars.ECR_PUBLISHER_ROLE_ARN }}
        run: python3 scripts/check_publisher_activation.py

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: midkernel-agentflow-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  oidc-claims:
    name: OIDC claims (debug)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Print non-secret GitHub OIDC claims
        run: python3 scripts/print_oidc_claims.py

  ecr:
    name: Push to ECR
    needs: [test, image, publisher-readiness]
    if: needs.publisher-readiness.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Print non-secret GitHub OIDC claims
        run: python3 scripts/print_oidc_claims.py
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: midkernel-runner-ecr
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
