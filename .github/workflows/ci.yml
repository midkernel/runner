# Build the Midkernel agent image. Push to ECR when OIDC is available.
#
# IT / midkernel/infra (James lock: IaC only — do not console-edit IAM):
# Repos created after 2026-07-15 emit GitHub's immutable OIDC `sub`:
#   repo:OWNER@OWNER-ID/REPO@REPO-ID:ref:refs/heads/BRANCH
# Terraform currently trusts the pre-2026 name-only shape:
#   repo:midkernel/{infra,app,runner}:*
# Those patterns do not match this JWT. This repo (created 2026-09-04):
#   use_default=true (not an org include_claim_keys customization)
#   sub_claim_prefix=repo:midkernel@324066512/runner@1357082961
# Replace allowed_sub_patterns with the immutable prefixes (keep StringLike):
#   repo:midkernel@324066512/infra@1357082965:*
#   repo:midkernel@324066512/app@1357082937:*
#   repo:midkernel@324066512/runner@1357082961:*
#
# Do not invent AWS changes from this repo. Do not commit AWS keys.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "489470371031"
  ECR_REPOSITORY: midkernel-agentflow-agents
  OIDC_ROLE: arn:aws:iam::489470371031:role/midkernel-github-actions

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: midkernel-agentflow-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  oidc-claims:
    name: OIDC claims (debug)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Print non-secret GitHub OIDC claims
        run: python3 scripts/print_oidc_claims.py

  ecr:
    name: Push to ECR
    needs: [test, image]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Print non-secret GitHub OIDC claims
        run: python3 scripts/print_oidc_claims.py
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: midkernel-runner-ecr
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
